<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/logo.webp" />
    <!-- The app's font is served with it (src/index.css); preload the Arabic weights the first screen uses. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-arabic-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-arabic-600.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-arabic-700.woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Hub</title>
      <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <style>
      /* Splash screen: plain HTML/CSS so it shows on the first paint, before the
         JavaScript bundle loads. The app removes it (src/lib/splash.ts). */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #f7f5f0; color: #5b6785;
        font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      #splash.dark { background: #0a1430; color: #cdd5e8; }
      #splash.splash-out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .splash-stage { position: relative; width: 168px; height: 168px; }
      #splash .splash-glow {
        position: absolute; inset: -36px; border-radius: 50%;
        background: radial-gradient(circle, rgba(21, 101, 224, 0.35) 0%, rgba(21, 101, 224, 0) 68%);
        opacity: 0; animation: splash-glow 2.4s ease-in-out 0.5s infinite;
      }
      #splash .splash-ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 3px solid rgba(245, 165, 10, 0.7); opacity: 0;
        animation: splash-ring 1.1s ease-out 0.55s both;
      }
      #splash .splash-logo {
        position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
        box-shadow: 0 18px 40px -12px rgba(11, 36, 99, 0.45);
        animation: splash-pop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) both, splash-float 3.2s ease-in-out 0.9s infinite;
      }
      #splash .splash-logo img { width: 100%; height: 100%; display: block; }
      #splash .splash-logo::after {
        content: ''; position: absolute; top: -20%; bottom: -20%; width: 38%; left: -60%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%);
        transform: skewX(-18deg); animation: splash-shine 1s ease-in-out 0.75s both;
      }
      #splash .splash-tagline {
        margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.1px;
        animation: splash-rise 0.6s ease-out 0.45s both;
      }
      #splash .splash-dots { display: flex; gap: 7px; animation: splash-rise 0.5s ease-out 0.7s both; }
      #splash .splash-dots span {
        width: 7px; height: 7px; border-radius: 50%; background: #1565e0;
        animation: splash-dot 1s ease-in-out infinite;
      }
      #splash .splash-dots span:nth-child(2) { background: #7c3aed; animation-delay: 0.15s; }
      #splash .splash-dots span:nth-child(3) { background: #f5a50a; animation-delay: 0.3s; }
      @keyframes splash-pop {
        0% { opacity: 0; transform: scale(0.55) rotate(-8deg); }
        70% { opacity: 1; }
        100% { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes splash-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
      @keyframes splash-shine { from { left: -60%; } to { left: 130%; } }
      @keyframes splash-ring { 0% { opacity: 0; transform: scale(0.95); } 15% { opacity: 0.9; } 100% { opacity: 0; transform: scale(1.45); } }
      @keyframes splash-glow { 0%, 100% { opacity: 0.55; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-dot { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-6px); opacity: 1; } }
      /* Animations wait for the logo image, so the intro isn't played blank. */
      #splash:not(.ready) * { animation-play-state: paused !important; }
      #splash:not(.ready) .splash-logo { opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; transition: opacity 0.2s ease !important; }
        #splash .splash-glow { opacity: 0.6; }
        #splash.splash-out { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Course Hub">
      <div class="splash-stage">
        <div class="splash-glow"></div>
        <div class="splash-ring"></div>
        <div class="splash-logo"><img src="/logo.webp" alt="Course Hub" width="168" height="168" /></div>
      </div>
      <p class="splash-tagline" id="splash-tagline">حوّل قناتك إلى دورة منظّمة</p>
      <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <script>
      // Same theme and language rules as src/lib/theme.tsx and src/lib/i18n.tsx.
      (function () {
        var el = document.getElementById('splash');
        var tg = window.Telegram && window.Telegram.WebApp;
        var store = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
        var mode = store('course-hub.theme');
        var dark = mode === 'dark' || (mode !== 'light' &&
          (tg && tg.colorScheme ? tg.colorScheme === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)));
        if (dark) el.classList.add('dark');
        var img = el.querySelector('img');
        var ready = function () { if (!el.dataset.readyAt) el.dataset.readyAt = String(performance.now()); el.classList.add('ready'); };
        if (img.complete) ready(); else { img.onload = ready; img.onerror = ready; setTimeout(ready, 1500); }
        var lang = store('course-hub.lang');
        var code = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
        if (lang !== 'ar' && lang !== 'en') lang = code && code.toLowerCase().indexOf('ar') !== 0 ? 'en' : 'ar';
        if (lang === 'en') {
          var tag = document.getElementById('splash-tagline');
          tag.textContent = 'Turn your channel into a course';
          tag.dir = 'ltr';
        }
        // Safety net: never keep the splash if the app fails to start.
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 10000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
