# send-reminder authenticates the caller itself (Telegram initData), so the
# gateway only needs to accept the project's anon key.
[functions.send-reminder]
verify_jwt = true

# Called by Telegram, which cannot send a Supabase JWT. Protected instead by the
# X-Telegram-Bot-Api-Secret-Token header (TELEGRAM_WEBHOOK_SECRET).
[functions.telegram-webhook]
verify_jwt = false

# Called before the user has a session; it verifies Telegram initData and mints one.
[functions.auth-telegram]
verify_jwt = false

# Checks the caller itself (Telegram initData) and reads the lesson through RLS;
# the gateway only needs to accept the project's anon key.
[functions.lesson-media]
verify_jwt = true

# Verifies Telegram initData itself and checks certificate ownership.
[functions.certificate-send]
verify_jwt = true

# Verifies Telegram initData itself and checks course ownership.
[functions.refresh-thumbnails]
verify_jwt = true

# Verify Telegram initData themselves (question author / course creator).
[functions.question-notify]
verify_jwt = true

[functions.course-announce]
verify_jwt = true

[functions.students-export]
verify_jwt = true
